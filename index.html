<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ЕГЭ и ОГЭ — новый адрес</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Times New Roman", Times, serif;
        background: #f7f3e9;
        color: #172026;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 440px);
        padding: 32px 28px;
        border: 10px solid #172026;
        border-radius: 28px;
        background: #fffdf8;
        text-align: center;
        box-shadow: 0 18px 55px rgba(23, 32, 38, 0.14);
      }

      small {
        color: #5f6f76;
        font-size: 14px;
      }

      h1 {
        margin: 8px 0 12px;
        font-size: 30px;
        line-height: 1.1;
      }

      p {
        margin: 0 0 24px;
        color: #46585f;
        font-size: 17px;
        line-height: 1.45;
      }

      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        border-radius: 8px;
        background: #167c72;
        color: #fff;
        font-size: 17px;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #0f625a;
      }
    </style>
  </head>
  <body>
    <main>
      <small>Тренажёр ЕГЭ и ОГЭ</small>
      <h1>Сайт переехал</h1>
      <p>Приложение работает по новому, более короткому адресу. Аккаунты и результаты сохранены.</p>
      <a href="https://egeoge-trainer.github.io/">Открыть новый сайт&nbsp;›</a>
    </main>
  </body>
</html>
